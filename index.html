<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Notes - A simple and secure online notes app.">
<title>Notes</title>

<!-- AdSense (correct placement in head) -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7085085116387086"
     crossorigin="anonymous"></script>

<style>
:root{
  --bg:#eef1f7;
  --panel:#ffffff;
  --border:#d7d9df;
  --text:#0f172a;
  --muted:#6b7280;
  --accent:#2563eb;
  --shadow:0 6px 20px rgba(0,0,0,0.08);
  --panel-height:64px;
  --panel-anim:200ms;
  --radius:10px;
  --gap:10px;
  --toolbar-height:64px;
  --max-width:980px;
}
body.dark{
  --bg:#0b1220;
  --panel:#111827;
  --border:#1f2937;
  --text:#ffffff;
  --muted:#94a3b8;
  --accent:#60a5fa;
  --shadow:0 6px 20px rgba(0,0,0,0.45);
}
body.solarized{
  --bg:#fdf6e3;
  --panel:#fffdf5;
  --border:#eee8d5;
  --text:#073642;
  --muted:#657b83;
  --accent:#268bd2;
}
body.dracula{
  --bg:#282a36;
  --panel:#1e1f29;
  --border:#44475a;
  --text:#f8f8f2;
  --muted:#6272a4;
  --accent:#bd93f9;
}

*{box-sizing:border-box;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
body{overflow:hidden;}

.app{display:flex;height:100vh;overflow:hidden;position:relative;}

/* Sidebar + drawer */
.sidebar{
  width:320px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  box-shadow:var(--shadow);
  z-index:3;
}
.header{padding:16px;font-weight:800;font-size:18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.brandSmall{font-size:12px;color:var(--muted);font-weight:600;}
.controls{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.controls button{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text);font-weight:600;}
.controls button:hover{background:var(--accent);color:#fff;}
.search{margin:10px;padding:8px;border-radius:8px;border:1px solid var(--border);width:calc(100% - 20px);background:transparent;color:var(--text);outline:none;}
.list{flex:1;overflow:auto;padding-bottom:12px;}
.note{padding:12px 12px 12px 36px;border-bottom:1px solid var(--border);position:relative;cursor:pointer;color:var(--text);display:flex;flex-direction:column;gap:6px;}
.note:hover{background:rgba(37,99,235,0.04);}
.note.active{background:rgba(37,99,235,0.10);}
.titleInput{width:100%;border:none;background:transparent;font-weight:700;font-size:14px;color:var(--text);outline:none;}
.meta{font-size:11px;color:var(--muted);}
.colorDot{width:12px;height:12px;border-radius:50%;position:absolute;left:12px;top:18px;}
.pinBtn,.deleteBtn{position:absolute;top:10px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:transparent;color:var(--text);}
.deleteBtn{right:10px;}
.pinBtn{right:70px;}
.deleteBtn:hover{background:#ef4444;color:#fff;}
.pinBtn:hover{background:#facc15;color:#000;}
.tagChip{display:inline-block;background:rgba(0,0,0,0.06);color:var(--text);padding:4px 8px;border-radius:999px;font-size:12px;margin-right:6px;margin-top:6px;border:1px solid var(--border);cursor:pointer;}

/* Drawer overlay for mobile */
.drawer-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  z-index:2;
  opacity:0;
  pointer-events:none;
  transition:opacity var(--panel-anim) ease;
}
.drawer-open .drawer-overlay{
  opacity:1;
  pointer-events:auto;
}
.drawer-open .sidebar{
  transform:translateX(0);
}
.sidebar{
  transition:transform var(--panel-anim) ease;
}
@media (max-width:900px){
  .sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    transform:translateX(-100%);
  }
}

/* Main area */
.main{flex:1;display:flex;flex-direction:column;position:relative;}

/* Toolbar */
.toolbar{
  display:flex;
  flex-wrap:nowrap;
  gap:8px;
  padding:10px;
  border-bottom:1px solid var(--border);
  align-items:center;
  background:var(--panel);
  box-shadow:var(--shadow);
  z-index:2;
  min-height:var(--toolbar-height);
  overflow-x:auto;
}
.toolbar::-webkit-scrollbar{height:6px;}
.toolbar::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.2);border-radius:999px;}
.toolbar .group{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.toolbar button{padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text);font-weight:600;white-space:nowrap;}
.toolbar button:hover{background:rgba(0,0,0,0.04);}
.toolbar button.icon-btn{width:40px;display:flex;align-items:center;justify-content:center;font-size:18px;}

.centerStatus{position:absolute;top:56px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);}
.editor{flex:1;max-width:var(--max-width);margin:0 auto;padding:84px 20px 20px;overflow:auto;font-size:16px;line-height:1.6;outline:none;color:var(--text);background:transparent;}
.stats{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--muted);}

/* Tag area */
.tagArea{max-width:var(--max-width);margin:0 auto;padding:8px 20px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tagInput{padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);min-width:160px;outline:none;}

/* Custom select */
.custom-select{position:relative;min-width:120px;flex-shrink:0;}
.custom-select .select-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;min-width:120px;white-space:nowrap;}
.custom-select .select-btn:focus{outline:2px solid rgba(37,99,235,0.18);}
.custom-select .options{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:8px;max-height:220px;overflow:auto;z-index:9999;display:none;}
.custom-select.open .options{display:block;}
.custom-select .option{padding:8px 10px;cursor:pointer;color:var(--text);border-bottom:1px solid rgba(0,0,0,0.03);}
.custom-select .option:last-child{border-bottom:none;}
.custom-select .option:hover{background:rgba(37,99,235,0.06);}

/* Slide bar */
.slideBar{position:fixed;left:0;right:0;top:calc(-1 * var(--panel-height));height:var(--panel-height);background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;padding:10px 16px;z-index:9999;transition:top var(--panel-anim) ease;color:var(--text);}
.slideBar.show{top:0;}
.slideBar .label{font-weight:700;margin-right:8px;}
.slideBar input[type="text"]{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);outline:none;}
.slideBar select{padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);outline:none;}
.slideBar .actions{display:flex;gap:8px;margin-left:8px;}
.slideBar .actions button{padding:8px 12px;border-radius:8px;border:1px solid var(--border);cursor:pointer;background:transparent;color:var(--text);}
.slideBar .actions .primary{background:var(--accent);color:#fff;border-color:var(--accent);}

/* Toast */
.toast{position:fixed;right:16px;bottom:16px;background:var(--panel);border:1px solid var(--border);padding:10px 12px;border-radius:8px;box-shadow:var(--shadow);color:var(--text);z-index:9999;display:none;align-items:center;gap:8px;}
.toast.show{display:flex;}
.toast button{padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;}
.toast .primary{background:var(--accent);color:#fff;border-color:var(--accent);}

/* Focus mode */
.focused .sidebar{display:none;}
.topLeftFocus{display:none;position:absolute;top:10px;left:10px;z-index:10;}
.focused .topLeftFocus{display:block;}

/* Mobile tweaks */
@media (max-width:900px){
  body{overflow:hidden;}
  .editor{padding-top:96px;}
  .stats{right:8px;bottom:8px;}
}
</style>
</head>
<body>
<div class="drawer-overlay" id="drawerOverlay"></div>

<div class="app" id="app">
  <div class="sidebar" id="sidebar">
    <div class="header">
      <div>Online Notes</div>
      <div class="brandSmall">— Notes Pro</div>
    </div>

    <div class="controls">
      <button id="btnNew">+ New</button>
      <button id="btnImport">Import</button>
      <button id="btnExport">Export</button>
      <button id="btnFocus">Focus</button>
      <button id="btnCloudExport">Cloud Export</button>
      <button id="btnCloudImport">Cloud Import</button>
      <button id="btnTrashView">Trash</button>
    </div>

    <input id="search" class="search" placeholder="Search notes... (use tag:yourtag to filter by tag)" />

    <div class="list" id="list"></div>
  </div>

  <div class="main">
    <div class="toolbar" id="toolbar">
      <!-- Hamburger (far left) -->
      <div class="group">
        <button id="btnMenu" class="icon-btn" aria-label="Toggle sidebar">☰</button>
      </div>

      <div class="group">
        <button id="btnCopy">Copy</button>
        <button id="btnPaste">Paste</button>
        <button id="btnUndo">Undo</button>
        <button id="btnRedo">Redo</button>
      </div>

      <div class="group">
        <button id="btnBold"><b>B</b></button>
        <button id="btnItalic"><i>I</i></button>
        <button id="btnUnderline"><u>U</u></button>
      </div>

      <div class="group">
        <div class="custom-select" id="selFontSize">
          <div class="select-btn" tabindex="0"><span id="selFontSizeLabel">Font Size</span><span>▾</span></div>
          <div class="options">
            <div class="option" data-value="2">Small</div>
            <div class="option" data-value="3">Normal</div>
            <div class="option" data-value="5">Large</div>
            <div class="option" data-value="7">Huge</div>
          </div>
        </div>

        <div class="custom-select" id="selFontName">
          <div class="select-btn" tabindex="0"><span id="selFontNameLabel">Font</span><span>▾</span></div>
          <div class="options">
            <div class="option" data-value="Arial">Arial</div>
            <div class="option" data-value="Georgia">Georgia</div>
            <div class="option" data-value="Courier New">Courier</div>
            <div class="option" data-value="Times New Roman">Times</div>
          </div>
        </div>
      </div>

      <div class="group">
        <input type="color" id="textColor" title="Text color" />
        <input type="color" id="highlightColor" title="Highlight color" />
      </div>

      <div class="group">
        <button id="btnSummarize">Summarize</button>
        <button id="btnRewrite">Rewrite</button>
        <button id="btnExpand">Expand</button>
        <button id="btnShorten">Shorten</button>
      </div>

      <div class="group">
        <button id="btnGenerate">Generate Text</button>
      </div>

      <div class="group" style="margin-left:auto;">
        <div class="custom-select" id="selTheme">
          <div class="select-btn" tabindex="0"><span id="selThemeLabel">Theme</span><span>▾</span></div>
          <div class="options">
            <div class="option" data-value="">Light</div>
            <div class="option" data-value="dark">Dark</div>
            <div class="option" data-value="solarized">Solarized</div>
            <div class="option" data-value="dracula">Dracula</div>
          </div>
        </div>
      </div>
    </div>

    <div class="centerStatus" id="status">Saved</div>

    <div id="editor" class="editor" contenteditable="true" spellcheck="true" aria-label="Note editor"></div>

    <div class="tagArea" id="tagArea" aria-hidden="false">
      <input id="tagInput" class="tagInput" placeholder="Add tag and press Enter (tags saved per note)" />
      <div id="tagList" style="display:flex;flex-wrap:wrap;"></div>
    </div>

    <div class="stats" id="stats">0 words • 0 chars</div>
  </div>
</div>

<div id="slideBar" class="slideBar" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
let notes = [];
let trash = [];
let active = null;
let saveTimer = null;
let lastTrashed = null;
const sources = ["Britannica","Smithsonian","NASA","World Bank","CDC","Library of Congress","National Archives"];
function randSource(){ return sources[Math.floor(Math.random()*sources.length)]; }
function now(){ return Date.now(); }

function showToast(msg, ms=2200, actionLabel=null, actionCallback=null){
  const t = document.getElementById('toast');
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  if(actionLabel && typeof actionCallback === 'function'){
    const btn = document.createElement('button');
    btn.textContent = actionLabel;
    btn.className = 'primary';
    btn.onclick = ()=>{
      actionCallback();
      t.classList.remove('show');
    };
    t.appendChild(btn);
  }
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=> t.classList.remove('show'), ms);
}

function save(){
  localStorage.setItem('notesProData', JSON.stringify({notes, trash}));
  document.getElementById('status').textContent = 'Saved';
}
function load(){
  try{
    const data = JSON.parse(localStorage.getItem('notesProData')||'{}');
    notes = Array.isArray(data.notes) ? data.notes : [];
    trash = Array.isArray(data.trash) ? data.trash : [];
  }catch(e){ notes = []; trash = []; }
}

function render(query=''){
  const list = document.getElementById('list');
  list.innerHTML = '';
  const q = (query||'').toLowerCase().trim();
  let tagFilter = null;
  let textFilter = q;
  if(q.startsWith('tag:')){
    tagFilter = q.slice(4).trim();
    textFilter = '';
  }
  const items = notes.map((n,i)=>({...n, idx:i}))
    .filter(n => {
      if(tagFilter){
        return Array.isArray(n.tags) && n.tags.some(t=>t.toLowerCase()===tagFilter);
      }
      if(!textFilter) return true;
      return n.title.toLowerCase().includes(textFilter) ||
             (n.content||'').toLowerCase().includes(textFilter) ||
             (Array.isArray(n.tags) && n.tags.join(' ').toLowerCase().includes(textFilter));
    })
    .sort((a,b) => (b.pinned - a.pinned) || (b.updated - a.updated));
  items.forEach(n=>{
    const div = document.createElement('div');
    div.className = 'note' + (n.idx===active ? ' active' : '');
    div.draggable = true;
    div.dataset.index = n.idx;
    const titleInput = document.createElement('input');
    titleInput.className = 'titleInput';
    titleInput.value = n.title || 'Untitled';
    titleInput.addEventListener('input', (e)=>{ notes[n.idx].title = e.target.value; save(); });
    const colorDot = document.createElement('div');
    colorDot.className = 'colorDot';
    colorDot.style.background = n.color || '#2563eb';
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = new Date(n.updated).toLocaleString();
    const pinBtn = document.createElement('button');
    pinBtn.className = 'pinBtn';
    pinBtn.textContent = 'Pin';
    pinBtn.onclick = (e)=>{ e.stopPropagation(); notes[n.idx].pinned = !notes[n.idx].pinned; save(); render(document.getElementById('search').value); };
    const delBtn = document.createElement('button');
    delBtn.className = 'deleteBtn';
    delBtn.textContent = 'Delete';
    delBtn.onclick = (e)=>{ e.stopPropagation(); moveToTrash(n.idx); };
    div.appendChild(colorDot);
    div.appendChild(titleInput);
    div.appendChild(meta);
    div.appendChild(pinBtn);
    div.appendChild(delBtn);
    if(Array.isArray(n.tags) && n.tags.length){
      n.tags.forEach(tag=>{
        const chip = document.createElement('span');
        chip.className = 'tagChip';
        chip.textContent = tag;
        chip.onclick = (e)=>{ e.stopPropagation(); document.getElementById('search').value = 'tag:' + tag; render('tag:' + tag); };
        div.appendChild(chip);
      });
    }
    div.addEventListener('click', (e)=>{
      if(e.target === titleInput || e.target === pinBtn || e.target === delBtn) return;
      openNote(n.idx);
    });
    div.addEventListener('dragstart', (e)=> e.dataTransfer.setData('text/plain', n.idx));
    div.addEventListener('dragover', (e)=> e.preventDefault());
    div.addEventListener('drop', (e)=>{
      e.preventDefault();
      const from = parseInt(e.dataTransfer.getData('text/plain'),10);
      const to = n.idx;
      if(isNaN(from) || from===to) return;
      const item = notes.splice(from,1)[0];
      notes.splice(to,0,item);
      save(); render(document.getElementById('search').value);
    });
    list.appendChild(div);
  });
}

const editor = document.getElementById('editor');
function updateStats(text){
  const words = (text.trim().split(/\s+/).filter(Boolean)).length;
  document.getElementById('stats').textContent = `${words} words • ${text.length} chars`;
}
editor.addEventListener('input', ()=>{
  document.getElementById('status').textContent = 'Saving...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    if(active===null) return;
    notes[active].content = editor.innerHTML;
    notes[active].title = (editor.innerText.split('\n')[0]||'Untitled').trim() || 'Untitled';
    notes[active].updated = now();
    save();
    updateStats(editor.innerText);
    render(document.getElementById('search').value);
  }, 200);
});

const tagInput = document.getElementById('tagInput');
const tagList = document.getElementById('tagList');
tagInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    const v = tagInput.value.trim();
    if(!v || active===null) return;
    notes[active].tags = notes[active].tags || [];
    if(!notes[active].tags.includes(v)){
      notes[active].tags.push(v);
      notes[active].updated = now();
      save();
      render(document.getElementById('search').value);
      renderTags();
      tagInput.value = '';
      showToast('Tag added');
    } else { tagInput.value = ''; }
  }
});
function renderTags(){
  tagList.innerHTML = '';
  if(active===null) return;
  const t = notes[active].tags || [];
  t.forEach((tag, idx)=>{
    const chip = document.createElement('span');
    chip.className = 'tagChip';
    chip.innerHTML = `${escapeHtml(tag)} <span class="x" data-idx="${idx}">×</span>`;
    chip.querySelector('.x').onclick = (e)=>{
      const i = parseInt(e.target.dataset.idx,10);
      notes[active].tags.splice(i,1);
      notes[active].updated = now();
      save();
      render(document.getElementById('search').value);
      renderTags();
      showToast('Tag removed');
    };
    tagList.appendChild(chip);
  });
}

function createNote(){
  notes.push({ title:'Untitled', content:'', updated: now(), pinned:false, color:'#2563eb', tags:[] });
  active = notes.length - 1;
  save(); render(); openNote(active);
  showToast('New note created');
}
function openNote(i){
  if(i==null || !notes[i]) return;
  active = i;
  editor.innerHTML = notes[i].content || '';
  updateStats(editor.innerText || '');
  render(document.getElementById('search').value);
  renderTags();
}
function moveToTrash(i){
  if(i==null || !notes[i]) return;
  const item = notes.splice(i,1)[0];
  item._trashedAt = now();
  trash.push(item);
  lastTrashed = { item, index: i };
  save(); render(document.getElementById('search').value);
  editor.innerHTML = '';
  updateStats('');
  showToast('Note moved to Trash', 6000, 'Undo', ()=> {
    if(!lastTrashed) return;
    const restored = trash.pop();
    notes.splice(lastTrashed.index, 0, restored);
    lastTrashed = null;
    save(); render(); showToast('Restored');
  });
}
const slideBar = document.getElementById('slideBar');
function setSlideBarContent(html){
  slideBar.innerHTML = html;
  slideBar.style.background = getComputedStyle(document.body).getPropertyValue('--panel');
  slideBar.style.borderBottom = '1px solid ' + (getComputedStyle(document.body).getPropertyValue('--border') || '#ddd');
  slideBar.style.color = getComputedStyle(document.body).getPropertyValue('--text');
}
function showSlideBar(){ slideBar.classList.add('show'); slideBar.setAttribute('aria-hidden','false'); }
function hideSlideBar(){ slideBar.classList.remove('show'); slideBar.setAttribute('aria-hidden','true'); }

function showTrashView(){
  let html = `<div style="display:flex;align-items:center;gap:12px;width:100%;">` +
             `<div style="display:flex;flex-direction:column;gap:6px;flex:1;"><div style="font-weight:700;">Trash</div>`;
  if(trash.length===0){
    html += `<div style="color:var(--muted)">Trash is empty</div>`;
  } else {
    html += `<div style="max-height:220px;overflow:auto;padding-top:6px;">`;
    trash.slice().reverse().forEach((t, idx)=>{
      const i = trash.length - 1 - idx;
      html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">` +
              `<div style="flex:1"><strong>${escapeHtml(t.title||'Untitled')}</strong><div style="font-size:12px;color:var(--muted)}">${new Date(t._trashedAt).toLocaleString()}</div></div>` +
              `<div style="display:flex;gap:8px"><button data-restore="${i}">Restore</button><button data-delete="${i}" style="background:#ef4444;color:#fff;border-color:#ef4444">Delete</button></div>` +
              `</div>`;
    });
    html += `</div>`;
  }
  html += `</div><div class="actions"><button id="closeTrash">Close</button><button id="emptyTrash" style="background:#ef4444;color:#fff;border-color:#ef4444">Empty Trash</button></div></div>`;
  setSlideBarContent(html);
  showSlideBar();
  setTimeout(()=>{
    document.getElementById('closeTrash').onclick = hideSlideBar;
    document.getElementById('emptyTrash').onclick = ()=>{
      trash = []; save(); hideSlideBar(); showToast('Trash emptied');
    };
    const buttons = slideBar.querySelectorAll('button[data-restore], button[data-delete]');
    buttons.forEach(b=>{
      if(b.dataset.restore){
        b.onclick = ()=>{
          const idx = parseInt(b.dataset.restore,10);
          const restored = trash.splice(idx,1)[0];
          notes.push(restored);
          save(); render(); renderTags(); showToast('Restored'); hideSlideBar();
        };
      } else if(b.dataset.delete){
        b.onclick = ()=>{
          const idx = parseInt(b.dataset.delete,10);
          trash.splice(idx,1);
          save(); render(); showToast('Permanently deleted'); hideSlideBar();
        };
      }
    });
  },50);
}

function importFile(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.txt,.md,.html,.json';
  input.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      notes.push({ title: file.name.replace(/\.[^/.]+$/,''), content: reader.result, updated: now(), pinned:false, color:'#2563eb', tags:[] });
      save(); render();
      showToast('File imported');
    };
    reader.readAsText(file);
  };
  input.click();
}
function exportNote(){
  if(active===null) return showToast('No note selected');
  const n = notes[active];
  const blob = new Blob([n.content || ''], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (n.title || 'note') + '.txt';
  a.click();
  showToast('Export started');
}
function exportCloud(){
  const blob = new Blob([JSON.stringify({notes,trash},null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'notes_pro_cloud.json';
  a.click();
  showToast('Cloud export ready');
}
function importCloud(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(Array.isArray(data.notes) || Array.isArray(data.trash)){
          notes = Array.isArray(data.notes) ? data.notes : notes;
          trash = Array.isArray(data.trash) ? data.trash : trash;
          save(); render(); showToast('Cloud import complete');
        } else if(Array.isArray(data)){
          notes = data; save(); render(); showToast('Cloud import complete');
        } else showToast('Invalid cloud file');
      }catch(err){ showToast('Invalid cloud file'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function aiSummarize(){
  const text = editor.innerText.trim();
  if(!text) return showToast('Nothing to summarize');
  const sentences = text.split(/(?<=[.!?])\s+/);
  const summary = sentences.slice(0, Math.max(1, Math.floor(sentences.length/3))).join(' ');
  editor.innerText = summary;
  editor.dispatchEvent(new Event('input'));
  showToast('Summarized');
}
function aiRewrite(){
  const text = editor.innerText.trim();
  if(!text) return showToast('Nothing to rewrite');
  const rewritten = text.replace(/\b(can't|won't|don't|it's|i'm|i've|we're)\b/gi, function(m){
    const map = {"can't":"cannot","won't":"will not","don't":"do not","it's":"it is","i'm":"I am","i've":"I have","we're":"we are"};
    return map[m.toLowerCase()] || m;
  }).replace(/(^\s*\w|[.!?]\s*\w)/g, s => s.toUpperCase());
  editor.innerText = rewritten;
  editor.dispatchEvent(new Event('input'));
  showToast('Rewritten');
}
function aiExpand(){
  const text = editor.innerText.trim();
  if(!text) return showToast('Nothing to expand');
  const expansion = "\n\nTo expand on this topic, consider how its principles apply in real-world scenarios, including practical examples and long-term implications for decision-making and outcomes.";
  editor.innerText = text + expansion;
  editor.dispatchEvent(new Event('input'));
  showToast('Expanded');
}
function aiShorten(){
  const text = editor.innerText.trim();
  if(!text) return showToast('Nothing to shorten');
  const sentences = text.split(/(?<=[.!?])\s+/);
  const keep = sentences.slice(0, Math.max(1, Math.floor(sentences.length/3))).join(' ');
  editor.innerText = keep;
  editor.dispatchEvent(new Event('input'));
  showToast('Shortened');
}
document.getElementById('btnSummarize').addEventListener('click', aiSummarize);
document.getElementById('btnRewrite').addEventListener('click', aiRewrite);
document.getElementById('btnExpand').addEventListener('click', aiExpand);
document.getElementById('btnShorten').addEventListener('click', aiShorten);

function showGeneratePanel(){
  const html = `
    <div style="display:flex;align-items:center;gap:12px;width:100%;">
      <div style="display:flex;flex-direction:column;gap:6px;flex:1;">
        <div style="font-weight:700;">Generate Text</div>
        <div style="display:flex;gap:8px;">
          <input id="genTopic" type="text" placeholder="Topic (e.g., The Industrial Revolution)" />
          <div class="custom-select" style="min-width:120px;">
            <div class="select-btn" tabindex="0"><span id="genLenLabel">Short</span><span>▾</span></div>
            <div class="options">
              <div class="option" data-value="short">Short</div>
              <div class="option" data-value="medium">Medium</div>
              <div class="option" data-value="long">Long</div>
            </div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button id="cancelGen">Cancel</button>
        <button id="confirmGen" class="primary">Generate</button>
      </div>
    </div>
  `;
  setSlideBarContent(html);
  showSlideBar();
  setTimeout(()=> {
    const topicEl = document.getElementById('genTopic');
    if(topicEl) topicEl.focus();
    const cs = slideBar.querySelector('.custom-select');
    if(cs){
      const btn = cs.querySelector('.select-btn');
      const opts = cs.querySelector('.options');
      btn.onclick = ()=> cs.classList.toggle('open');
      opts.querySelectorAll('.option').forEach(o=>{
        o.onclick = ()=>{
          cs.querySelector('#genLenLabel').textContent = o.textContent;
          cs.classList.remove('open');
          cs.dataset.value = o.dataset.value;
        };
      });
      document.addEventListener('click', (e)=>{ if(!cs.contains(e.target)) cs.classList.remove('open'); }, {once:true});
    }
  }, 50);

  document.getElementById('cancelGen').onclick = ()=> hideSlideBar();
  document.getElementById('confirmGen').onclick = ()=>{
    const topic = document.getElementById('genTopic').value.trim();
    const cs = slideBar.querySelector('.custom-select');
    const length = cs && cs.dataset.value ? cs.dataset.value : 'short';
    if(!topic){ showToast('Please enter a topic'); document.getElementById('genTopic').focus(); return; }
    hideSlideBar();
    generateEssay(topic, length);
  };
}

function generateEssay(topic, length){
  const cite = ()=> `(${randSource()})`;
  const safeTopic = escapeHtml(topic);
  const intro = `An overview of ${safeTopic} ${cite()}: ${safeTopic} is a subject that connects historical development, practical application, and contemporary relevance.`;
  const background = `${safeTopic} has evolved through key events, changing social priorities, and technological advances ${cite()}. Understanding this background clarifies why it matters today.`;
  const mechanisms = `Core mechanisms within ${safeTopic} include structural drivers, stakeholder incentives, and feedback loops that shape outcomes ${cite()}.`;
  const impacts = `The impacts of ${safeTopic} appear in measurable results, policy decisions, and everyday practice ${cite()}.`;
  const conclusion = `In conclusion, focused study of ${safeTopic} supports better decisions, clearer communication, and more sustainable long-term outcomes ${cite()}.`;

  let paragraphs = [];
  if(length === 'short'){
    paragraphs = [intro + ' ' + impacts];
  } else if(length === 'medium'){
    paragraphs = [intro, background + ' ' + impacts];
  } else {
    paragraphs = [intro, background, mechanisms + ' ' + impacts + ' ' + conclusion];
  }

  const html = paragraphs.map(p => `<p>${p}</p>`).join('');
  notes.push({ title: `Essay on ${topic}`, content: html, updated: now(), pinned:false, color:'#2563eb', tags:[] });
  active = notes.length - 1;
  save(); render(document.getElementById('search').value); openNote(active);
  showToast('Essay generated about "' + topic + '"');
}

function setThemeClass(t){
  if(t === 'light' || t === '') document.body.className = '';
  else document.body.className = t;
  slideBar.style.background = getComputedStyle(document.body).getPropertyValue('--panel');
  slideBar.style.color = getComputedStyle(document.body).getPropertyValue('--text');
  editor.style.color = getComputedStyle(document.body).getPropertyValue('--text');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; });
}

function wireCustomSelect(id, onSelect){
  const root = document.getElementById(id);
  if(!root) return;
  const btn = root.querySelector('.select-btn');
  const opts = root.querySelectorAll('.option');
  btn.addEventListener('click', ()=> root.classList.toggle('open'));
  btn.addEventListener('keydown', (e)=> { if(e.key==='Enter' || e.key===' ') { e.preventDefault(); root.classList.toggle('open'); } });
  opts.forEach(o=>{
    o.addEventListener('click', ()=>{
      const v = o.dataset.value;
      const text = o.textContent;
      root.querySelector('span').textContent = text;
      root.classList.remove('open');
      if(typeof onSelect === 'function') onSelect(v, text);
    });
  });
  document.addEventListener('click', (e)=>{ if(!root.contains(e.target)) root.classList.remove('open'); });
}

wireCustomSelect('selFontSize', (v)=> applyFontSize(v));
wireCustomSelect('selFontName', (v)=> applyFontName(v));
wireCustomSelect('selTheme', (v, text)=> { setThemeClass(v); document.getElementById('selThemeLabel').textContent = text; });

document.addEventListener('keydown', (e)=>{
  if(e.ctrlKey && e.key === 'n'){ e.preventDefault(); createNote(); }
  if(e.ctrlKey && e.key === 'e'){ e.preventDefault(); exportNote(); }
  if(e.ctrlKey && e.key === 'd'){ e.preventDefault(); if(active!==null){ const copy = JSON.parse(JSON.stringify(notes[active])); copy.title += ' copy'; copy.updated = now(); notes.push(copy); save(); render(); showToast('Note duplicated'); } }
  if(e.ctrlKey && e.key === 'Delete'){ e.preventDefault(); if(active!==null) moveToTrash(active); }
});

  editor.style.color = getComputedStyle(document.body).getPropertyValue('--text');

}
